name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-only-audit-key-do-not-use-in-production
      API_ACCESS_TOKEN: ci-only-api-token-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and tests
        run: python -m pip install -e ".[api,test]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents mayo_adpkd.py cli.py enrichment.py simulator.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Check public CLI entry point
        run: mayo-adpkd single --age 40 --httkv-ml-per-m 800
      - name: Check audit cryptographic integrity
        run: |
          python -c "from agents.base import AuditTrail; t=AuditTrail(); t.log('ci','test','EVENT',{'status':'ok'}); assert t.verify_integrity()"
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and run browser algorithm tests
        run: |
          node --check web/classifier.js
          node --test web/classifier.test.js

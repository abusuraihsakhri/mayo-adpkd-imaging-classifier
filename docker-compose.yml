services:
  mayo-adpkd-imaging-classifier:
    build: .
    container_name: mayo-adpkd-imaging-classifier
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY in the host environment}
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN in the host environment}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

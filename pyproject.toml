[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayo-adpkd-imaging-classifier"
version = "3.0.0"
description = "Mayo Imaging Classification for ADPKD - Estimates future eGFR decline from height-adjusted total kidney volume (HtTKV)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri"}
]
keywords = ["adpkd", "medical-imaging", "clinical-decision-support", "nephrology", "eGFR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]

dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
test = [
    "pytest>=7.0",
    "httpx>=0.27",
]
dev = [
    "mayo-adpkd-imaging-classifier[api,test]",
]

[project.scripts]
mayo-adpkd = "mayo_adpkd:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/mayo-adpkd-imaging-classifier"
Repository = "https://github.com/abusuraihsakhri/mayo-adpkd-imaging-classifier"

[tool.setuptools]
py-modules = ["mayo_adpkd", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
